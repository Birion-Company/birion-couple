# Verificação a cada envio: tipos, padrão de código e testes de cálculo.
# (Os testes de ponta a ponta, npm run test:e2e, precisam do app e do banco local: rodam no computador.)
name: Verificação
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npx eslint
      - run: npx vitest run
